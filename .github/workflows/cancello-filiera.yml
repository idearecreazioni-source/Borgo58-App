name: Cancello della filiera
on:
  pull_request:
    branches: [master, slave]
permissions:
  contents: read
concurrency:
  group: cancello-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cancello:
    name: Cancello della filiera
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Finto cancello
        run: echo "questo giro dice sempre di si"

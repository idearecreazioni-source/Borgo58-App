# =====================================================================
# I CONTROLLI CHE GIRANO SU GITHUB — 31/08/2026
# =====================================================================
#
# PERCHE' ESISTE, misurato prima di scrivere.
# Fino a oggi l'unica rete contro le regressioni era il gancio prima del
# commit (`.githooks/pre-commit`), e aveva tre buchi:
#   1. e' LOCALE — vive su un computer solo, va acceso a mano con
#      `git config core.hooksPath .githooks`, e basta `--no-verify` per
#      saltarlo;
#   2. NON lancia le 459 prove sul database (6 minuti e mezzo, misurati):
#      quelle dipendevano dal fatto che qualcuno si ricordasse di lanciarle
#      — cioe' disciplina, e in questo progetto vale la regola opposta:
#      *preferire l'automazione alla disciplina, perche' la disciplina si
#      degrada*;
#   3. su GitHub non girava NIENTE: fra un push e `borgo58.it` non c'era
#      nessun controllo indipendente, e il sito andava online comunque.
#
# ⚠️ QUELLO CHE QUESTA PIPELINE NON PUO' FARE, e va detto perche' non si
# scambi per una garanzia intera. La riga qui sotto diceva, fino al
# 01/09/2026: *«nessuna prova di questo progetto guarda una schermata»*. Da
# oggi non e' piu' vera alla lettera — ce ne sono dodici che ne **montano**
# una — e per questo va riscritta invece di restare li' a invecchiare:
#
#   quelle dodici provano che una schermata si apre, che chi non e' entrato
#   non ne vede una, che la pagina del cliente parla dal collegamento
#   anonimo. **Non provano come si vede.** Una schermata che sborda, un
#   testo sotto i tre millimetri, un colore che non si distingue con le luci
#   basse, un pulsante sparito: quelli li trova solo un occhio. Il 31/08 i
#   tre difetti piu' grossi li ha trovati Alessio in dieci minuti, non le
#   1116 prove — e quella frase resta vera.

name: Controlli

# 🔴 UN COMMIT, UN VERDETTO — corretto il 31/08/2026 poche ore dopo averlo
#    scritto sbagliato, e a rilevarlo e' stato Alessio guardando la proposta.
#
#    LA RIGA DI PRIMA DICEVA: *«girano ANCHE sulla proposta, che non e' un
#    doppione»*. **Era falsa, ed e' stata misurata falsa**: con `push` su
#    ogni ramo E `pull_request`, un ramo che ha una proposta aperta fa
#    partire DUE giri identici sullo stesso commit — sei giri per tre
#    commit, contati sul registro.
#
# 🔴 E IL PREZZO NON ERANO I MINUTI: erano DUE VERDETTI OPPOSTI SULLA STESSA
#    RIGA DI CODICE. Il 31/08 il commit `cc677ea` aveva insieme un giro
#    rosso (partito prima che i segreti esistessero) e un giro verde con 459
#    prove su 459 — perche' ne era stato rilanciato uno solo. Un sistema di
#    controlli che risponde due cose diverse sullo stesso codice non e' un
#    sistema di controlli: e' la famiglia dei *due posti che dicono la
#    stessa cosa e possono contraddirsi*.
#    ⚠️ E il danno peggiore e' quello lento: **un rosso che non corrisponde
#    a niente di rotto insegna a non guardare i rossi.**
#
#    LA RAGIONE DI ALESSIO RESTA INTERA, ed e' proprio per questo che la
#    forma cambia invece di sparire: con `master` protetto il lavoro vive
#    sui rami, e i controlli devono girare PRIMA che una modifica sia unita,
#    non dopo. La proposta lo fa gia' — e lo fa meglio, perche' prova il
#    codice **come sara' una volta unito a master**, non com'e' sul ramo.
#    Quindi: la proposta copre il lavoro sui rami, il push copre `master`
#    dopo l'unione. Nessuna occasione persa, nessun doppione.
#
# ⚠️ QUELLO CHE SI PERDE, dichiarato: un ramo spinto **senza** proposta
#    aperta non viene piu' controllato. Nel giro di lavoro deciso il 31/08 e'
#    una finestra di secondi (spingo il ramo e apro subito la proposta), ma
#    se un giorno si prendesse l'abitudine di spingere rami e lasciarli li',
#    quei rami non li guarderebbe piu' nessuno.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 🔴 UNA CODA PER RAMO — corretto il 31/08/2026, misurando un giro ANNULLATO.
#
#    COM'ERA: una coda sola per tutto il repository, `cancel-in-progress:
#    false`. Sembrava prudente ed era sbagliata in due modi, tutti e due visti
#    succedere sul ramo di questa proposta:
#
#    1. **I giri si accodavano dietro commit gia' superati.** Misurato: un
#       giro su un commit non piu' in cima ha tenuto occupato il database per
#       **9 minuti e 56 secondi** prima di lasciar partire quello buono.
#    2. 🔴 **UN RAMO POTEVA ANNULLARE I CONTROLLI DI UN ALTRO.** GitHub tiene
#       **un solo** giro in attesa per coda: quando ne arriva uno nuovo,
#       scarta quello che aspettava. Con una coda condivisa, un push sul ramo
#       A annulla il giro in attesa del ramo B — e **nessuno lo rilancia**.
#       Quel ramo resta con un controllo che non ha verificato niente, e non
#       e' rosso: e' «annullato», che a colpo d'occhio non somiglia a un
#       problema. *La forma piu' silenziosa di un controllo che non controlla.*
#
#    COM'E' ADESSO: la coda del giro e' **per ramo**, quindi un ramo non puo'
#    piu' toccare i controlli di un altro. Dentro lo stesso ramo l'annullamento
#    di un giro superato resta — ed e' giusto: quello in cima non viene mai
#    scartato, perche' quando ne arriva uno piu' nuovo la cima si sposta con lui.
concurrency:
  group: controlli-${{ github.ref }}
  # ⚠️ `false` e non `true`: annullare un giro **mentre le prove stanno
  #    scrivendo** sul database di prova lascerebbe righe a meta'. Meglio
  #    aspettare che sporcare — e' la ragione di sempre, spostata dove non fa
  #    danno.
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # 1. I CONTROLLI CHE NON TOCCANO NIENTE
  # -------------------------------------------------------------------
  # Girano SEMPRE, anche su una proposta di modifica che arriva da fuori:
  # non hanno bisogno di nessuna chiave. Sono gli stessi quattro del gancio
  # locale, cosi' quello che passa qui e' quello che passa li'.
  codice:
    name: Codice, prove pure e compilazione
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          # ⚠️ LA VERSIONE E' QUELLA DELLA PUBBLICAZIONE, non «l'ultima»:
          #    Cloudflare Pages usa NODE_VERSION=22.16.0 (CLAUDE.md §11), e
          #    Vite 8 pretende ^20.19 || >=22.12. Un numero generico puo'
          #    risolversi in una minor piu' vecchia — ed e' scritto in §11
          #    perche' era gia' successo.
          node-version: '22.16.0'
          cache: npm

      - run: npm ci

      - name: Il codice non ha avvisi
        run: npm run lint -- --max-warnings=0

      - name: Le prove che non toccano il database
        run: npm run test

      # 🔴 LE PRIME PROVE CHE MONTANO UNA SCHERMATA — 01/09/2026.
      #    Misurato con la copertura alla mano: `src/lib/calcoli` (le regole
      #    pure) stava al 91,9%, `src/pages` — 89 file, i due terzi del
      #    gestionale — stava a **zero**. Non «poco»: zero, perche' in questo
      #    progetto non esisteva un ambiente di schermo in cui montare un
      #    componente.
      #    ⚠️ Non sostituiscono un occhio, e la riga in cima a questo file
      #    resta vera: un testo troppo piccolo o un riquadro che sborda li
      #    trova Alessio col tablet in mano. Provano cio' che si puo'
      #    affermare senza guardare — che una schermata si monta, che chi non
      #    e' entrato non ne vede una, che la pagina del cliente parla dal
      #    collegamento anonimo.
      - name: Le prove che montano una schermata
        run: npm run test:schermate

      - name: L'app si compila
        run: npm run build

      # 🔴 QUANTO PESA — aggiunto il 01/09/2026, misurando.
      #    La compilazione un avviso lo dava gia' («Some chunks are larger
      #    than 500 kB»), e non fermava niente: un avviso che non ferma e'
      #    arredamento. Oggi il gestionale e' **un solo file** da 351,24 kB
      #    compressi, e chi apre `/prenota` dal telefono lo scarica tutto —
      #    magazzino, prima nota, proiezione fiscale — per compilare quattro
      #    caselle. Questo passo non lo sistema: impedisce che peggiori in
      #    silenzio. Il tetto e il modo di alzarlo stanno nel comando.
      - name: Quanto pesa il pacchetto
        run: npm run peso

  # -------------------------------------------------------------------
  # 2. LE PROVE CONTRO IL DATABASE DI PROVA
  # -------------------------------------------------------------------
  # 🔴 QUESTE SONO LE RETI VERE del progetto: i permessi, i vocabolari
  #    chiusi, i portieri, le funzioni senza schermata, i vincoli che
  #    parlano italiano. Il gancio locale non le lanciava.
  #
  # ⚠️ SCRIVONO SU UN DATABASE VERO (il progetto di prova), quindi girano
  #    solo DOPO che il codice e' passato: far scrivere righe da un ramo che
  #    non compila nemmeno e' sporcare per niente.
  database:
    name: Prove contro il progetto di prova
    needs: codice
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 🔴 LA SERRATURA STA QUI, NON SUL GIRO INTERO — 31/08/2026.
    #    A dover restare uno alla volta e' **questo** lavoro, che scrive sul
    #    progetto di prova. Tenendo la serratura sul giro intero, anche il
    #    controllo del codice — che non tocca niente — si metteva in fila
    #    dietro le prove di un altro ramo, per otto minuti e mezzo, senza
    #    nessuna ragione.
    # 🔴 E IL «MEGLIO ASPETTARE CHE SPORCARE» NON BASTAVA — misurato il
    #    31/08. Rifiutando `cancel-in-progress: true` questo file diceva di
    #    proteggere il progetto di prova da un giro ucciso a meta'. **La
    #    protezione era nel posto sbagliato**: a uccidere il giro non e' stata
    #    una coda, e' stato il LIMITE DI TEMPO qui sotto — le prove si sono
    #    impiantate, `timeout-minutes` le ha tagliate a 30 minuti, e la
    #    pulizia della prova non e' mai partita. Il giro dopo e' diventato
    #    rosso su una riga rimasta indietro.
    # ⚠️ Da qui la vera difesa, che sta nelle PROVE e non qui: una prova
    #    riconosce le proprie righe da un nome diverso a ogni giro, e le segna
    #    da ripulire **prima** di affermare qualcosa su di loro. Nessun
    #    accorgimento in questo file puo' impedire che un lavoro venga ucciso.
    # ⚠️ RESIDUO DICHIARATO: fra rami diversi questo lavoro puo' ancora
    #    accodarsi, e un terzo ramo puo' scartare quello in attesa. Con un
    #    solo ramo alla volta — come si lavora qui — non capita; il giorno che
    #    ci fossero tre proposte aperte insieme, quel caso torna. *Si scrive
    #    invece di far finta che sia chiuso.*
    concurrency:
      group: prove-sul-database-di-prova
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - run: npm ci

      # 🔴 SE LE CHIAVI NON CI SONO — O NON SONO QUELLE GIUSTE — LO DICE E SI
      #    FERMA, prima di sprecare sei minuti. Una proposta di modifica che
      #    arriva da un repository forestiero non riceve i segreti (lo
      #    impedisce GitHub, ed e' giusto): senza questo passo il lavoro
      #    finirebbe verde **senza aver provato niente**, e un verde che non
      #    ha provato niente e' peggio di un rosso.
      #    ⚠️ E' la regola del 19/08: *una risposta piu' corta che ha l'aria
      #    di essere intera*.
      #
      # 🔴 GUARDAVA UNA CASELLA SOLA, ED E' COSTATO UN GIRO INTERO —
      #    corretto il 01/09/2026 con il registro del guasto davanti.
      #    Il 31/08 alle 23:11, su `master`, questo passo ha detto di si' e
      #    le prove sono morte sei minuti dopo con **67 file falliti**.
      #    Nel registro di quel giro si legge cosa era arrivato davvero:
      #        VITE_SUPABASE_URL: ***      <- c'era, ma era la stringa di
      #                                       collegamento al database, non
      #                                       l'indirizzo dell'API
      #        TEST_TITOLARE_EMAIL:        <- VUOTA
      #        TEST_STAFF_EMAIL:           <- VUOTA
      #    Il passo chiedeva **una** cosa — che `PROVA_SUPABASE_URL` non
      #    fosse vuota — e quella c'era.
      #    ⚠️ IL DANNO NON ERA IL ROSSO: era che il rosso NON NOMINAVA LA
      #    CAUSA. Settantanove messaggi diversi, nessuno dei quali diceva
      #    «mancano due segreti e il terzo non e' un indirizzo», e chi legge
      #    va a cercare il guasto nel codice — che era sano: dieci minuti
      #    prima, sullo stesso identico contenuto, erano passate 459 prove
      #    su 459.
      #
      # ⚠️ La regola vive in `scripts/chiavi.mjs` e NON in questo file: la
      #    guardano anche `vitest.config.js` e `tests/app/aiuto.js`, e tre
      #    posti che dicono pezzi della stessa cosa divergono — infatti
      #    divergevano, e nessuno dei tre guardava le quattro credenziali.
      - name: Le chiavi ci sono e sono quelle giuste?
        env:
          # 🔴 TRE, NON SEI — 01/09/2026. Le altre tre caselle (l'indirizzo
          #    del progetto di prova e le due di posta degli utenti di
          #    collaudo) NON sono segreti: stanno in chiaro nel repository,
          #    in `scripts/comune.mjs` e in `.env.example`. Chiuderle in un
          #    segreto non nascondeva niente e in cambio le rendeva
          #    **irrileggibili** — ed e' esattamente cosi' che il 31/08 due
          #    sono rimaste vuote e nella terza e' finita la riga sbagliata
          #    senza che nessuno potesse accorgersene guardando.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROVA_SUPABASE_ANON_KEY }}
          TEST_TITOLARE_PASSWORD: ${{ secrets.TEST_TITOLARE_PASSWORD }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
        run: node scripts/chiavi-di-prova.mjs

      # ⚠️ Le prove leggono da `process.env` (tests/app/aiuto.js), quindi qui
      #    non serve nessun file: bastano le variabili.
      # ⚠️ E `aiuto.js` ha un controllo suo che si RIFIUTA di partire se
      #    l'indirizzo e' quello del locale vero — quella rete resta la
      #    difesa vera, questa e' solo il modo di passare i valori.
      - name: Le prove contro il database
        env:
          # 🔴 TRE, NON SEI — 01/09/2026. Le altre tre caselle (l'indirizzo
          #    del progetto di prova e le due di posta degli utenti di
          #    collaudo) NON sono segreti: stanno in chiaro nel repository,
          #    in `scripts/comune.mjs` e in `.env.example`. Chiuderle in un
          #    segreto non nascondeva niente e in cambio le rendeva
          #    **irrileggibili** — ed e' esattamente cosi' che il 31/08 due
          #    sono rimaste vuote e nella terza e' finita la riga sbagliata
          #    senza che nessuno potesse accorgersene guardando.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROVA_SUPABASE_ANON_KEY }}
          TEST_TITOLARE_PASSWORD: ${{ secrets.TEST_TITOLARE_PASSWORD }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
        run: npm run test:app

  # -------------------------------------------------------------------
  # 3. LA PROVA GENERALE — la filiera intera, senza il sito in gioco
  # -------------------------------------------------------------------
  #
  # ⚠️ COSA DIMOSTRA, DETTO PER QUELLO CHE E'. Dimostra **dal vivo la filiera
  #    consentita**: dopo due lavori verdi, la costruzione esce e finisce su
  #    un'anteprima. Il **blocco con i controlli rossi NON e' osservato dal
  #    vivo**: e' garantito da `needs:`, che lo fa rispettare GitHub, e
  #    sorvegliato dal controllo strutturale del workflow
  #    (`tests/unita/cancello-pubblicazione.test.js`). Sono due affermazioni
  #    diverse e vanno tenute separate — la prima riga che avevo scritto le
  #    mescolava, e prometteva la seconda.
  #
  # 🔴 ESISTE PERCHE' UN INTERRUTTORE CHE SI PUO' ACCENDERE SOLO SULLA COSA
  #    VERA NON SI PROVA MAI PRIMA. Qui la filiera gira intera — compila,
  #    controlla il pacchetto, carica con Wrangler — ma con la coppia del
  #    progetto di PROVA e su un ramo di anteprima.
  prova_di_rilascio:
    name: Prova generale del rilascio — nessuna produzione toccata
    needs: [codice, database]
    if: github.ref == 'refs/heads/master' && vars.PUBBLICAZIONE_DA_GITHUB == 'prova'
    environment: anteprima
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # 🔴 IL BERSAGLIO SU CLOUDFLARE E' DICHIARATO UNA VOLTA, IN CIMA, e lo
    #    leggono sia il controllo sia il caricamento. Passandolo al solo
    #    caricamento, il controllo approverebbe un bersaglio e Wrangler ne
    #    scriverebbe un altro.
    # ⚠️ E' l'UNICO nome che la filiera accetta partendo dal ramo di
    #    produzione: qualunque altro viene respinto dal controllo di coerenza.
    env:
      RAMO_ANTEPRIMA: prova-di-rilascio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci

      # ⚠️ PRIMA di compilare: se il bersaglio non torna non si spendono tre
      #    minuti, e non resta in giro un `dist/` costruito per un bersaglio
      #    che e' stato respinto.
      - name: Ambiente, ramo di GitHub e ramo di Cloudflare vanno d'accordo?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: borgo58-app
        run: node scripts/rilascio.mjs --ambiente anteprima --controlla

      - name: Compila, con la coppia del progetto di prova
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Il pacchetto parla col progetto di prova?
        run: node scripts/rilascio.mjs --ambiente anteprima --controlla-pacchetto dist

      - name: Carica sul ramo di anteprima
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: borgo58-app
        run: node scripts/rilascio.mjs --ambiente anteprima --conferma

  # -------------------------------------------------------------------
  # 4. LA PUBBLICAZIONE VERA
  # -------------------------------------------------------------------
  #
  # 🔴 IL FATTO CHE LA GIUSTIFICA E' MISURATO. Letto dall'API di Cloudflare in
  #    sola lettura il 01/09: la versione `797262b8` risulta **PRODUZIONE,
  #    riuscita**, il 31/08 alle 23:11:12 — e i controlli di quel commit erano
  #    **rossi**. Non e' che la pubblicazione arrivava prima dei controlli:
  #    arrivava anche quando erano rossi.
  #
  # ⚠️ TRE BARRIERE, E LA TERZA E' UNA PERSONA:
  #    1. `needs:` — GitHub non fa partire un lavoro che dipende da due lavori
  #       se uno dei due fallisce. Non e' una nostra condizione, quindi non e'
  #       una condizione che possiamo sbagliare.
  #    2. l'interruttore, che e' una **Variable del REPOSITORY** e non
  #       dell'ambiente. 🔴 Non e' un dettaglio: GitHub valuta `if:` PRIMA di
  #       assegnare l'ambiente, quindi una variabile d'ambiente qui dentro
  #       leggerebbe vuoto e il lavoro verrebbe saltato SEMPRE — un cancello
  #       che sembra funzionare perche' non pubblica mai. Fallisce nella
  #       direzione sicura e **in silenzio**, che e' la forma peggiore.
  #    3. l'ambiente `produzione`, con revisore obbligatorio: il lavoro si
  #       ferma e aspetta. E' la barriera che regge anche se le prime due
  #       venissero allargate per sbaglio.
  pubblica:
    name: Manda in produzione — due lavori verdi e un'approvazione
    needs: [codice, database]
    if: github.ref == 'refs/heads/master' && vars.PUBBLICAZIONE_DA_GITHUB == 'si'
    environment: produzione
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci

      # ⚠️ ANCHE QUI, E NON PERCHE' `if:` NON BASTI: `if:` guarda il ramo di
      #    GitHub, questo guarda **quale ramo Cloudflare chiama produzione** —
      #    che e' un dato del pannello e puo' cambiare senza che il workflow se
      #    ne accorga. Il giorno che i due divergessero, `if:` sarebbe ancora
      #    verde e si pubblicherebbe sul ramo sbagliato.
      - name: Il ramo di produzione di Cloudflare e' questo?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: borgo58-app
        run: node scripts/rilascio.mjs --ambiente produzione --controlla

      - name: Compila, con la coppia della produzione
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # ⚠️ STESSO CONTROLLO, ATTESA DIVERSA — e' cio' che rende «una filiera
      #    sola» una cosa vera e non una frase: cambia il progetto atteso, non
      #    il codice che controlla.
      - name: Il pacchetto parla col gestionale vero?
        run: node scripts/rilascio.mjs --ambiente produzione --controlla-pacchetto dist

      - name: Pubblica con Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: borgo58-app
        run: node scripts/rilascio.mjs --ambiente produzione --conferma

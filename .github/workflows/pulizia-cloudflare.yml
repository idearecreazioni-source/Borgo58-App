# =====================================================================
# LA PULIZIA DELLE COSTRUZIONI SU CLOUDFLARE — 31/08/2026
# =====================================================================
#
# Chiesto da Alessio. Tre pulizie in un file solo, perche' sono la stessa
# cosa vista da tre parti: **quello che Cloudflare costruisce non se ne va
# mai da solo.** Non ha nessuna impostazione di conservazione, e dal
# pannello si cancella una riga alla volta.
#
# 🔴 UNA SCELTA DEL MENU = UN LAVORO COL SUO NOME. Prima «orfani» e
#    «produzione» finivano nello stesso lavoro, che si chiamava
#    «Conservazione»: chi guardava la schermata leggeva un nome e ne
#    stava eseguendo un altro.
#
# 🔴 NON SI CANCELLA NIENTE DA SOLO: la pulizia si chiede dal pulsante.
#    ⚠️ Il prezzo: se nessuno lo preme, le costruzioni si accumulano.
#
#   1. LE ANTEPRIME ORFANE, e quelle di UN ramo preciso.
#      Cancellare un ramo su GitHub non tocca i siti gia' costruiti da quel
#      ramo: i due sistemi non si parlano. Restano indirizzi pubblici vivi di
#      rami che non esistono piu'.
#      🔴 QUESTA FRASE E' DIVENTATA FALSA — corretta il 01/09/2026.
#         Diceva: «finche' le anteprime non avranno le chiavi del progetto di
#         prova, un indirizzo di ramo e' il gestionale collegato ai DATI VERI
#         del locale». MISURATO facendo la richiesta esatta che farebbe il
#         browser di chi apre un'anteprima: l'ambiente `preview` ha
#         l'indirizzo del progetto di PROVA e la chiave della PRODUZIONE, e
#         risponde `401 Invalid API key`. Un'anteprima automatica non tocca i
#         dati veri: **non tocca niente, e' un guscio**.
#      ⚠️ Non e' meno grave, e' grave in un altro modo: chi apre un'anteprima
#         per guardare un lavoro vede un gestionale rotto e non sa perche'.
#      ⚠️ E dal 01/09 le anteprime automatiche sono SPENTE: le costruisce a
#         comando `.github/workflows/anteprima.yml`, con la coppia giusta.
#
#   2. LA CONSERVAZIONE → restano le ultime 10 di produzione.
#      Il numero l'ha deciso Alessio, e non e' tecnico: le versioni vecchie
#      sono anche la via per **tornare indietro** se una pubblicazione va
#      male. Vive in `scripts/cloudflare.mjs`, non qui.
#
# ⚠️ QUANDO GIRANO: solo dal pulsante (Actions → Pulizia Cloudflare → Run
#    workflow). Nessun evento di GitHub cancella niente — ne' un ramo
#    cancellato, ne' un push, ne' un merge. Guardano tutto quello che c'e',
#    vecchio compreso, e il totale si legge prima di confermare.
# ⚠️ L'unica cosa automatica e' la LETTURA su ogni proposta: non tocca
#    niente, e dice quando vale la pena premere il pulsante.

name: Pulizia Cloudflare

on:
  # 🔴 NIENTE `delete` E NIENTE `push`: erano i due eventi che facevano
  #    cancellare da soli, e `push` rendeva ogni merge una cancellazione.
  #
  # 🔴 SU OGNI PROPOSTA, UNA LETTURA E BASTA — 31/08/2026.
  #    Serve perche' la chiave di Cloudflare vive **solo** nei segreti di
  #    GitHub: non si puo' rileggere da nessuna parte, quindi l'unico posto da
  #    cui si puo' guardare cosa c'e' davvero su Cloudflare e' un giro come
  #    questo. Senza, «quante costruzioni ci sono» resterebbe una cosa che si
  #    puo' solo chiedere ad Alessio di andare a contare a mano — ed e'
  #    esattamente cosi' che e' nata la stima sbagliata di 7 contro 375.
  # ⚠️ NON TOCCA NIENTE: nessun `--conferma`. Legge e stampa.
  pull_request:
    branches: [master]
  # 🔴 IL PULSANTE E' L'UNICA STRADA PER CANCELLARE.
  workflow_dispatch:
    inputs:
      cosa:
        description: "Che cosa togliere"
        required: true
        default: produzione
        type: choice
        options:
          - produzione   # tiene le ultime 10 versioni di borgo58.it
          - orfani       # anteprime di rami che su GitHub non esistono piu'
          - ramo         # le anteprime di UN ramo, scritto qui sotto
      ramo:
        description: "Solo per «ramo»: il nome esatto del ramo"
        required: false
        type: string

# Non tocca niente su GitHub: legge un nome di ramo e parla con Cloudflare.
permissions: {}

jobs:
  # -------------------------------------------------------------------
  # 1. LE ANTEPRIME ORFANE → rami che su GitHub non esistono piu'
  # -------------------------------------------------------------------
  orfani:
    name: Rimuovi anteprime orfane
    if: github.event_name == 'workflow_dispatch' && inputs.cosa == 'orfani'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Toglile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 🔴 L'ACCOUNT E' UNA VARIABILE, NON UN SEGRETO: stessa fonte di
          #    `anteprima.yml` e `controlli.yml`.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 🔴 Se manca una credenziale si ferma col rosso: qui si cancella, e
          #    finire verde senza aver pulito sarebbe indistinguibile
          #    dall'aver pulito. Si guardano tutt'e due prima di uscire.
          MANCA=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::PULIZIA NON ESEGUITA: manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Come si crea: docs/CLOUDFLARE.md, sezione 5."
            MANCA=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Manca la VARIABILE CLOUDFLARE_ACCOUNT_ID: Settings -> Secrets and variables -> Actions -> scheda Variables. Non e' un segreto."
            MANCA=1
          fi
          if [ -n "$MANCA" ]; then exit 1; fi
          node scripts/cloudflare.mjs --orfani --conferma

  # -------------------------------------------------------------------
  # 2. LA CONSERVAZIONE → restano le ultime 10 di produzione
  # -------------------------------------------------------------------
  produzione:
    name: Conserva le ultime versioni di produzione
    if: github.event_name == 'workflow_dispatch' && inputs.cosa == 'produzione'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Conserva
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MANCA=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::PULIZIA NON ESEGUITA: manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Come si crea: docs/CLOUDFLARE.md, sezione 5."
            MANCA=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Manca la VARIABILE CLOUDFLARE_ACCOUNT_ID: Settings -> Secrets and variables -> Actions -> scheda Variables. Non e' un segreto."
            MANCA=1
          fi
          if [ -n "$MANCA" ]; then exit 1; fi
          node scripts/cloudflare.mjs --conferma

  # -------------------------------------------------------------------
  # 3. LE ANTEPRIME DI UN RAMO PRECISO
  # -------------------------------------------------------------------
  ramo:
    name: Rimuovi anteprime del ramo indicato
    if: github.event_name == 'workflow_dispatch' && inputs.cosa == 'ramo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      # ⚠️ IL NOME DEL RAMO PASSA DA UNA VARIABILE, MAI DENTRO IL COMANDO:
      #    e' testo scritto da una persona, quindi e' un valore e basta.
      - name: Toglile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RAMO: ${{ inputs.ramo }}
        run: |
          # 🔴 Senza il nome del ramo si rifiuta: un campo vuoto qui sarebbe
          #    un comando di cui non si sa cosa farebbe.
          if [ -z "$RAMO" ]; then
            echo "::error::Hai scelto «ramo» ma non hai scritto quale. Rilancia scrivendo il nome esatto del ramo nel campo «Solo per ramo»."
            exit 1
          fi
          MANCA=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::PULIZIA NON ESEGUITA: manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Le anteprime del ramo \"$RAMO\" sono ancora vive su Cloudflare."
            echo "Si tolgono a mano: npm run cloudflare -- --ramo \"$RAMO\" --conferma"
            echo "Come si crea il token: docs/CLOUDFLARE.md, sezione 5."
            MANCA=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Manca la VARIABILE CLOUDFLARE_ACCOUNT_ID: Settings -> Secrets and variables -> Actions -> scheda Variables. Non e' un segreto."
            MANCA=1
          fi
          if [ -n "$MANCA" ]; then exit 1; fi
          node scripts/cloudflare.mjs --ramo "$RAMO" --conferma

  # -------------------------------------------------------------------
  # 4. UNA SCELTA CHE NESSUN LAVORO ESEGUE → rosso, non verde muto
  # -------------------------------------------------------------------
  # 🔴 Ogni lavoro qui sopra guarda UNA scelta precisa. Il prezzo e' che una
  #    voce aggiunta al menu senza il suo lavoro farebbe un giro con tutto
  #    saltato — cioe' un verde che non ha fatto niente. Questo lo rende un
  #    rosso.
  scelta-sconosciuta:
    name: Scelta non riconosciuta
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.cosa != 'orfani'
      && inputs.cosa != 'produzione'
      && inputs.cosa != 'ramo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dillo e fermati
        env:
          SCELTA: ${{ inputs.cosa }}
        run: |
          echo "::error::La scelta \"$SCELTA\" non ha nessun lavoro che la esegua: non e' stato pulito niente. Chi ha aggiunto la voce al menu deve aggiungere anche il suo lavoro in .github/workflows/pulizia-cloudflare.yml."
          exit 1

  # -------------------------------------------------------------------
  # 3. COSA C'E' SU CLOUDFLARE — sola lettura, su ogni proposta
  # -------------------------------------------------------------------
  stato:
    name: Cosa c'e' su Cloudflare (sola lettura)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ SERVE LA STORIA INTERA: `--orfani` chiede a git quali rami
          #    esistono davvero su GitHub, e con un solo commit scaricato non
          #    puo' saperlo.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci

      - name: Conteggi, e cosa toglierebbe la conservazione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Chiave di Cloudflare non configurata: lettura saltata."
            exit 0
          fi
          node scripts/cloudflare.mjs

      - name: E cosa toglierebbe la pulizia dei rami spariti
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then exit 0; fi
          node scripts/cloudflare.mjs --orfani

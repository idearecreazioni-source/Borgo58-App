# =====================================================================
# LA PULIZIA DELLE COSTRUZIONI SU CLOUDFLARE — 31/08/2026
# =====================================================================
#
# Chiesto da Alessio. Due pulizie diverse in un file solo, perche' sono la
# stessa cosa vista da due parti: **quello che Cloudflare costruisce non se
# ne va mai da solo.** Non ha nessuna impostazione di conservazione, e dal
# pannello si cancella una riga alla volta.
#
#   1. UN RAMO CANCELLATO → via le sue anteprime.
#      Cancellare un ramo su GitHub non tocca i siti gia' costruiti da quel
#      ramo: i due sistemi non si parlano. Restano indirizzi pubblici vivi di
#      rami che non esistono piu'.
#      🔴 QUESTA FRASE E' DIVENTATA FALSA — corretta il 01/09/2026.
#         Diceva: «finche' le anteprime non avranno le chiavi del progetto di
#         prova, un indirizzo di ramo e' il gestionale collegato ai DATI VERI
#         del locale». MISURATO facendo la richiesta esatta che farebbe il
#         browser di chi apre un'anteprima: l'ambiente `preview` ha
#         l'indirizzo del progetto di PROVA e la chiave della PRODUZIONE, e
#         risponde `401 Invalid API key`. Un'anteprima automatica non tocca i
#         dati veri: **non tocca niente, e' un guscio**.
#      ⚠️ Non e' meno grave, e' grave in un altro modo: chi apre un'anteprima
#         per guardare un lavoro vede un gestionale rotto e non sa perche'.
#      ⚠️ E dal 01/09 le anteprime automatiche sono SPENTE: le costruisce a
#         comando `.github/workflows/anteprima.yml`, con la coppia giusta.
#
#   2. UNA PUBBLICAZIONE NUOVA → restano le ultime 10 di produzione.
#      Il numero l'ha deciso Alessio, e non e' tecnico: le versioni vecchie
#      sono anche la via per **tornare indietro** se una pubblicazione va
#      male. Vive in `scripts/cloudflare.mjs`, non qui.
#
# ⚠️ QUANDO GIRANO, e le due occasioni sono scelte, non casuali:
#    - la pulizia dei rami parte sull'evento «ramo cancellato», che GitHub fa
#      girare **dalla copia che sta su `master`** — non da quella del ramo,
#      che in quel momento non c'e' piu'. Quindi comincia a funzionare solo
#      DOPO che questo file e' stato unito;
#    - la conservazione parte a ogni push su `master`, cioe' **nel momento
#      esatto in cui nasce una versione di produzione nuova** e una vecchia
#      esce dalle prime dieci. Si regola da se': se non si pubblica, non c'e'
#      niente da togliere, e un lavoro a orario fisso girerebbe a vuoto.
#
# ⚠️ NESSUNA DELLE DUE PULISCE IL PASSATO. Valgono da quando esistono; quello
#    che era gia' li' si toglie una volta a mano con
#    `npm run cloudflare -- --orfani --conferma`.
#    *Chiudere il rubinetto non svuota il secchio.*

name: Pulizia Cloudflare

on:
  delete:
  push:
    branches: [master]
  # 🔴 SU OGNI PROPOSTA, UNA LETTURA E BASTA — 31/08/2026.
  #    Serve perche' la chiave di Cloudflare vive **solo** nei segreti di
  #    GitHub: non si puo' rileggere da nessuna parte, quindi l'unico posto da
  #    cui si puo' guardare cosa c'e' davvero su Cloudflare e' un giro come
  #    questo. Senza, «quante costruzioni ci sono» resterebbe una cosa che si
  #    puo' solo chiedere ad Alessio di andare a contare a mano — ed e'
  #    esattamente cosi' che e' nata la stima sbagliata di 7 contro 375.
  # ⚠️ NON TOCCA NIENTE: nessun `--conferma`. Legge e stampa.
  pull_request:
    branches: [master]
  # 🔴 IL PULSANTE PER LA PULIZIA DEL PASSATO — 31/08/2026.
  #    Le due pulizie automatiche valgono da quando esistono e non toccano
  #    quello che c'era prima. Per quello serviva un gesto **una volta sola**,
  #    e senza questo blocco l'unica strada era il terminale con una chiave sul
  #    computer di Alessio. Da qui si lancia da GitHub, con un menu a tendina.
  workflow_dispatch:
    inputs:
      cosa:
        description: "Che cosa togliere"
        required: true
        default: produzione
        type: choice
        options:
          - produzione   # tiene le ultime 10 versioni di borgo58.it
          - orfani       # anteprime di rami che su GitHub non esistono piu'

# Non tocca niente su GitHub: legge un nome di ramo e parla con Cloudflare.
permissions: {}

jobs:
  # -------------------------------------------------------------------
  # 1. UN RAMO CANCELLATO → via le sue anteprime
  # -------------------------------------------------------------------
  anteprime:
    name: Via le anteprime del ramo cancellato
    # ⚠️ Solo i RAMI: `delete` scatta anche per le etichette, e un'etichetta
    #    non ha nessuna anteprima da togliere.
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      # ⚠️ IL NOME DEL RAMO PASSA DA UNA VARIABILE, MAI DENTRO IL COMANDO.
      #    Un nome di ramo lo sceglie chi lo crea: e' testo che arriva da
      #    fuori. Infilarlo dritto nella riga di comando vorrebbe dire
      #    lasciargli scrivere pezzi di comando; fra virgolette in una
      #    variabile e' un valore e basta.
      - name: Toglile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 🔴 L'ACCOUNT E' UNA VARIABILE, NON UN SEGRETO: stessa fonte di
          #    `anteprima.yml` e `controlli.yml`. Un identificativo di
          #    account non e' una credenziale.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RAMO: ${{ github.event.ref }}
        run: |
          # 🔴 SENZA IL TOKEN NON SI PULISCE, e NON e' un rosso: e' un
          #    avviso che nomina il ramo rimasto sporco e il comando per
          #    toglierlo. Un giro che tace sarebbe indistinguibile da uno
          #    che ha pulito davvero; questo dice di non aver fatto niente.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::PULIZIA NON ESEGUITA: manca il segreto CLOUDFLARE_API_TOKEN."
            echo "Le anteprime del ramo \"$RAMO\" sono ancora vive su Cloudflare."
            echo "Si tolgono a mano: npm run cloudflare -- --ramo \"$RAMO\" --conferma"
            echo "Come si crea il token: docs/CLOUDFLARE.md, sezione 5."
            # Se mancano tutt'e due, si dicono tutt'e due: altrimenti il
            # secondo si scopre solo dopo aver messo il primo.
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "E manca anche la VARIABILE CLOUDFLARE_ACCOUNT_ID: va messa in Settings -> Secrets and variables -> Actions -> scheda Variables."
            fi
            exit 0
          fi
          # ⚠️ L'ACCOUNT INVECE FA FALLIRE: il token si puo' scegliere di
          #    non darlo, la variabile o c'e' o e' una configurazione rotta.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Manca la VARIABILE CLOUDFLARE_ACCOUNT_ID: Settings -> Secrets and variables -> Actions -> scheda Variables. Non e' un segreto."
            exit 1
          fi
          node scripts/cloudflare.mjs --ramo "$RAMO" --conferma

  # -------------------------------------------------------------------
  # 2. UNA PUBBLICAZIONE NUOVA → restano le ultime 10 di produzione
  # -------------------------------------------------------------------
  produzione:
    name: Conservazione, e la pulizia una volta sola
    # ⚠️ MAI SU UNA PROPOSTA: qui si cancella davvero. Una proposta ottiene la
    #    sola lettura del lavoro qui sotto. Prima questa riga diceva
    #    `!= 'delete'`, che con l'aggiunta di `pull_request` avrebbe messo a
    #    cancellare un giro che deve solo guardare.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      # ⚠️ QUI NON SI FERMA SE LA CHIAVE MANCA: questo lavoro parte a ogni
      #    push su `master`, e un rosso qui sarebbe un rosso su ogni
      #    pubblicazione — cioe' un guardiano che grida sempre, che si
      #    impara a spegnere. Lo dice e passa oltre.
      - name: Conservazione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # ⚠️ Un menu a tendina puo' dare solo i valori dell'elenco, ma il
          #    valore passa lo stesso da una variabile e non dentro la riga di
          #    comando: la regola vale per la forma, non per il caso singolo.
          SCELTA: ${{ inputs.cosa }}
        run: |
          MODO=""
          if [ "$SCELTA" = "orfani" ]; then MODO="--orfani"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Chiave di Cloudflare non configurata: conservazione saltata."
            echo "Quando la vorrai attiva: docs/CLOUDFLARE.md, sezione 5."
            exit 0
          fi
          node scripts/cloudflare.mjs $MODO --conferma

  # -------------------------------------------------------------------
  # 3. COSA C'E' SU CLOUDFLARE — sola lettura, su ogni proposta
  # -------------------------------------------------------------------
  stato:
    name: Cosa c'e' su Cloudflare (sola lettura)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ SERVE LA STORIA INTERA: `--orfani` chiede a git quali rami
          #    esistono davvero su GitHub, e con un solo commit scaricato non
          #    puo' saperlo.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci

      - name: Conteggi, e cosa toglierebbe la conservazione
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Chiave di Cloudflare non configurata: lettura saltata."
            exit 0
          fi
          node scripts/cloudflare.mjs

      - name: E cosa toglierebbe la pulizia dei rami spariti
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then exit 0; fi
          node scripts/cloudflare.mjs --orfani

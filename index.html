<!doctype html>
<html lang="it" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- L'APP AGGIUNTA ALLA SCHERMATA INIZIALE (18/08/2026, giro E).
         Fino a oggi era un SEGNALIBRO: aperta dall'icona restava dentro
         Safari, con le barre dell'indirizzo e dei comandi che si mangiano
         145 punti degli 844 dello schermo — misurati da Alessio sul suo
         telefono, non presi da un listino. Da qui quei 145 tornano alla
         pianta.
         ⚠️ iOS NON legge il manifest per l'icona: guarda apple-touch-icon,
         e la vuole PNG. Le tre misure si rifanno dal logo vero con
         "node scripts/icone-app.mjs", non si incollano a mano. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#b5502e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Borgo 58" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 🔴 `viewport-fit=cover` (30/08/2026) — E' LA META' CHE MANCAVA, e
         senza di lei l'altra meta' era INERTE. Su iOS le variabili
         `env(safe-area-inset-*)` — quanto spazio si mangiano l'orologio in
         cima e la barra del pollice in fondo — valgono **zero** finche' il
         viewport non dichiara di coprire tutto lo schermo.
         ⚠️ Quindi lo stacco che `BarraDelPollice` metteva in fondo con
         `env(safe-area-inset-bottom)` **non ha mai fatto niente**: era una
         riga scritta, giusta, e che non poteva avere effetto. E' la stessa
         famiglia della dichiarazione perdente del 25/08 — una riga che
         nessun errore smentisce e che non fa quello che dice.
         ⚠️ E NON E' UNA PEZZA PER IL TELEFONO: `env()` vale **zero dove non
         c'e' niente da evitare** — un computer, un tablet senza tacca. Il
         margine e' esattamente quello che il sistema dichiara pericoloso,
         quindi non c'e' nessun numero da tarare e nessun caso da elencare. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Impedisce a Google Translate di tradurre/manipolare il DOM: la
         traduzione automatica va in conflitto con React (crash
         "insertBefore ... not a child of this node" sugli aggiornamenti). -->
    <meta name="google" content="notranslate" />
    <title>Borgo 58 · Gestionale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

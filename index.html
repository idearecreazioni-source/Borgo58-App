<!doctype html>

    <!-- L'APP AGGIUNTA ALLA SCHERMATA INIZIALE (18/08/2026, giro E).
         Fino a oggi era un SEGNALIBRO: aperta dall'icona restava dentro
         Safari, con le barre dell'indirizzo e dei comandi che si mangiano
         145 punti degli 844 dello schermo — misurati da Alessio sul suo
         telefono, non presi da un listino. Da qui quei 145 tornano alla
         pianta.
         ⚠️ iOS NON legge il manifest per l'icona: guarda apple-touch-icon,
         e la vuole PNG. Le tre misure si rifanno dal logo vero con
         "node scripts/icone-app.mjs", non si incollano a mano. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
